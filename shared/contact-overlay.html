<!-- Contact Overlay — shared component -->
<!-- Copy this block into each page that needs the contact overlay -->
<div id="contact-overlay" class="contact-overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-hidden="true">
  <div class="contact-overlay__inner">
    <button type="button" class="contact-overlay__close" aria-label="Закрыть">×</button>
    <div class="contact-overlay__content">
      <div class="contact-overlay__form-col">
        <h2 class="h2 h2--invert" id="overlay-title">Есть вопросы?</h2>
        <p class="subhead subhead--invert">Оставьте заявку — проведем бесплатный анализ и предложим стратегию.</p>
        <form id="overlay-lead-form" novalidate>
          <div class="form__row">
            <label class="label" for="overlay-name">Имя</label>
            <input id="overlay-name" name="name" class="input" type="text" placeholder="Ваше имя" required />
          </div>
          <div class="form__row">
            <label class="label" for="overlay-phone">Контактные данные</label>
            <input id="overlay-phone" name="phone" class="input" type="text" inputmode="text" autocomplete="tel" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Вотсап, тг, почта, мобильный телефон" required />
          </div>
          <div class="form__row">
            <label class="label" for="overlay-message">Сообщение</label>
            <textarea id="overlay-message" name="message" class="textarea" rows="4" placeholder="Кратко опишите задачу"></textarea>
          </div>
          <label class="checkbox">
            <input type="checkbox" required />
            <span>Согласен(а) на обработку персональных данных</span>
          </label>
          <button class="btn btn--dark" type="submit">Отправить</button>
          <p class="form__hint">Мы свяжемся с вами в ближайшее время</p>
          <div id="overlay-form-toast" class="toast" role="status" aria-live="polite"></div>
        </form>
      </div>
      <div class="contact-overlay__social-col">
        <div class="contact-overlay__pfp-wrap">
          <img src="/pfp1.jpg" alt="Панаско Александр" class="contact__pfp" loading="lazy" />
          <!-- 
          <div class="contact-overlay__pfp-caption">
            <strong>Панаско Александр</strong>
            <span>Генеральный директор Room4Life</span>
          </div> 
          -->
        </div>
        <hr class="contact-overlay__social-divider">
        <p class="contact-overlay__social-title">Прямая связь:</p>
        <a href="tel:+79266047397" class="contact-overlay__phone-display">+7 (926) 604-73-97</a>
        <a href="https://t.me/AlexandrInvestMaster" class="contact-overlay__social-link" rel="noopener" target="_blank" aria-label="Telegram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.941z"/></svg>
          Telegram
        </a>
      </div>
    </div>
  </div>
</div>
